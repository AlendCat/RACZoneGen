[application]
poll_interval_seconds = 30
log_level = DEBUG

[database]
odbc_connection_string = Driver={SQL Server};Server=C001749812\MINESTAR;Database=mshist;Trusted_Connection=yes;
query_timeout_seconds = 60

[rac]
query_file = sql/rac_events.sql
time_cutoff_minutes = 120
grouping_radius_metres = 50
grouping_score = 3
minimum_event_count = 2
top_n = 10
threshold_inclusive = false

[lanes]
query_file = sql/lanes.sql
refresh_interval_seconds = 300

[zone]
template_file = zones.xml
output_directory = output
name_prefix = RacMonitorGen_zone
zone_size_metres = 100
elevation = 300
suppression_radius_metres = 300
zones_query_file = sql/zones.sql
zones_refresh_interval_seconds = 300

[speed]
default_speed_kmh = 40
speed_offset_kmh = 10
minimum_speed_kmh = 5
maximum_speed_kmh = 80

[minestar]
mstar_bin_directory = D:\mstar\mstarHome\bus\bin
executable = mstarrun.bat
current_zones_file = runtime\current_zones.xml
timeout_seconds = 120
import_enabled = false
dry_run = true
show_only = false
allow_outside_mine_boundary = false
import_workers = 1

[simulation]
; Fakes ONLY the RAC event stream (an additive stream of synthetic events
; at the hotspots below). Lanes and existing zones are still read live
; from the MineStar SQL Server. Set enabled = true (or pass --simulate).
enabled = false
random_seed = 20260820
spawn_per_cycle = 2
jitter_metres = 30
level_min = 1
level_max = 4
speed_min = 30
speed_max = 65
time_window_minutes = 120
hotspots = 100.0,100.0;340.0,180.0;620.0,420.0

[display]
enabled = true