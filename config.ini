[application]
# How often (seconds) the main loop polls the MineStar DB for new RAC events.
# Used for both live and --simulate mode: app.py waits max(poll - elapsed, 1)
# via wait_for_next_cycle() while pumping the viewer GUI so the window stays responsive.
# Smaller = more responsive / more DB load. 8s is the mine default.
poll_interval_seconds = 8

[database]
# SQL Server host/instance that hosts the mshist/msmodel databases.
# Auth mode is controlled by use_windows_authentication below:
#   true  (default) = Windows Integrated Auth (Driver={SQL Server}; Trusted_Connection=yes).
#                     Runs as whoever launches the exe. username/password are ignored.
#   false = SQL Server login with UID/PWD from username/password below.
#           Both must be set. Supports %ENV_VAR% expansion, e.g. password = %RAC_DB_PASSWORD%.
server = C001749812\MINESTAR
# Database name for the MineStar historian (RAC events) and msmodel (zones/lanes).
# msmodel is queried automatically for existing zones; mshist for RAC events.
database = mshist
use_windows_authentication = true
username =
password =
# Single unified folder that holds all SQL files.
# Relative paths are resolved against the folder that owns this config.ini,
# so a machine-global install (%PUBLIC%\RACZoneGen\config.ini) is relocatable.
# Expected files inside this folder:
#   rac_events.sql → recent RAC health events (HEALTH_EVENT, event_Number 697-700 etc)
#   lanes.sql      → left/right edge points of active autonomous lanes
#   zones.sql      → envelope bounding boxes of active zones (msmodel.dbo.ZONE)
sql_directory = sql

[rac]
# Hub-radius clustering: any event within this radius (metres) of a new seed
# is considered part of the same group. Deterministic X-descending seed order.
grouping_radius_metres = 50
# Summed Level of all members must exceed this to qualify.
# Score = sum(Level) (level 1-5, 1 yellow → 5 red). Always inclusive (>).
# Example: 5 events × level 4 = 20 > 8 → qualifies; 2×4=8 → does NOT (needs >8).
grouping_score = 8
# Minimum number of events inside the 50m radius to even be considered a cluster.
# Prevents a single high-severity event from creating a zone. Needs ≥5.
minimum_event_count = 5

[zone]
# Where generated zone XML files are written before import.
# In real mode (simulation import_enabled=true or live) the file is temp and
# is DELETED after a successful mstarrun import (minestar.py import_zone).
# In simulation with import_enabled=false the file is kept for review (PROPOSED).
output_directory = output
# Square zone size (metres). Zone is zone_size × zone_size centred on the
# cluster centroid. 100 → 100m × 100m (half_size 50).
zone_size_metres = 100
# Do not create a new zone if its centroid is within this distance (metres)
# of any existing RacMonitorGen_zone* zone (read via direct SQL every 5s).
# Prevents duplicate/overlapping zones while a previous zone is still active.
suppression_radius_metres = 300
# How often (seconds) to refresh the in-memory library of existing zones.
# Uses fast direct SQL (zones.sql, ~10ms) so 5s is cheap; deletions appear on
# the map within one poll cycle. Lanes are separate (6h).
zones_refresh_interval_seconds = 5

[lanes]
# How often (seconds) to re-query autonomous lane geometry from msmodel.
# Lanes rarely change (mine design), so 6h (21600s) reduces DB load.
# The viewer caches the PatchCollection and only rebuilds the green lane
# polygons when the actual lane data changes — per-cycle repaints are cheap.
refresh_interval_seconds = 21600

[minestar]
# Full path to the MineStar runner that executes importZones/exportZones.
# Must include the .bat/.cmd extension. The directory of this file is used
# as cwd for the `cmd /d /c mstarrun.bat -b importZones` subprocess.
# Timeout, workers and allowOutsideMineBoundary are hardcoded:
#   timeout 120s, workers 1 (serialized), allowOutside false.
mstarrun_location = D:\mstar\mstarHome\bus\bin\mstarrun.bat

[speed]
# Payload -> km/h conversion. 0 = auto (divide by 10 until <= 200 km/h).
# Set explicitly per site once the raw PAYLOAD unit is known, e.g. 10000
# for a site reporting 218200 for a ~22 km/h truck.
payload_speed_divisor = 0
# Zone limit = avg_speed - offset, clamped to [minimum, maximum].
speed_offset_kmh = 10
minimum_speed_kmh = 5
maximum_speed_kmh = 60

[simulation]
# When true (or --simulate on CLI) the RAC event stream is faked —
# an additive stream of synthetic events at the hotspots below.
# Lanes and existing zones are STILL read live from the real SQL Server,
# so the map shows the current mine and real zones.
enabled = false
# When simulation is active, should those synthetic clusters also be REALLY
# imported into MineStar (staged to bus\bin\zones.xml → mstarrun → deleted)?
# false = PROPOSED only (blue, file kept for review, safe demo, no DB change).
# true  = behave like live: mstarrun import, file deleted, DB gains zone.
import_enabled = true
# Seed for the synthetic RNG so `jitter` and random level/speed are repeatable
# across runs. Change to get a different spatial pattern.
random_seed = 20260824
# How many new synthetic events to spawn per hotspot per polling cycle.
# 1/cycle/hotspot + tight jitter → predictable demo: needs 5 cycles to reach
# the 5-event minimum, so zones appear on the 5th cycle.
spawn_per_cycle = 1
# Gaussian jitter (metres, std dev) applied to each spawned event around its
# hotspot centre. Keep << grouping_radius (50) for tight clusters that will
# reliably group; 500 would scatter events and rarely cluster.
jitter_metres = 500
# Random Level range (RAC severity 0-5) used when hotspot Level is not set.
# If hotspots specify Level (e.g. 100,100,4) that value is used directly.
# Level drives colour (1 yellow → 5 red) and score (sum Level).
level_min = 0
level_max = 5
# Random Speed range (km/h) used when hotspot Speed is not set.
# Written into payload JSON {"Speed":..} so database._payload_speed parses it.
# Zone speed limit is then: limit = avg_speed - 10, floor 5, no max.
# If no speed can be parsed the cluster is logged and skipped (no default).
speed_min = 1
speed_max = 60
# How long (minutes) synthetic events are kept before being pruned.
# Must be ≥ time_cutoff (hardcoded 120) so events live long enough to cluster.
time_window_minutes = 120
# Hotspot definitions: X,Y[,Level[,Speed]]; separate multiple with ;
#   X,Y are mine coordinates (if outside lane bounds they are clamped inside).
#   Level/Speed optional — if omitted uses the random ranges above.
#   Default 3 hotspots near the site centre give a quick 3-cluster demo.
hotspots = 100.0,100.0;340.0,180.0;620.0,420.0
