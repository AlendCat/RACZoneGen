[application]
# How often (seconds) the main loop polls MineStar for new RAC events.
poll_interval_seconds = 8
# Python log level: DEBUG, INFO, WARNING, ERROR.
log_level = DEBUG

[database]
# ODBC connection string for the live MineStar SQL Server (mshist/msmodel).
odbc_connection_string = Driver={SQL Server};Server=C001749812\MINESTAR;Database=mshist;Trusted_Connection=yes;
# Seconds to wait for any single SQL query before timing out.
query_timeout_seconds = 60
# Single unified folder that holds all SQL files (rac_events.sql, lanes.sql, zones.sql).
# Relative paths are resolved against the folder that owns this config.ini.
sql_directory = sql

[rac]
# How far back (minutes) to look for RAC health events on each poll.
time_cutoff_minutes = 120
# Hub-radius clustering: events within this radius (metres) of a seed are grouped.
grouping_radius_metres = 50
# Summed Level of a group must exceed this to qualify (score = sum(Level)).
grouping_score = 8
# Minimum number of events in the radius to form a cluster.
minimum_event_count = 5
# Maximum clusters returned per cycle (sorted by score, highest first).
top_n = 10
# If false, score must be strictly > threshold; if true, >= threshold.
threshold_inclusive = false

[zone]
# Where generated zone XML files are written before import.
# In normal (non-dry-run) mode these are temp files and are deleted after a
# successful import; in dry_run/show_only/simulation they are kept for review.
output_directory = output
# Square zone size (metres). Zone is zone_size x zone_size centred on cluster.
zone_size_metres = 100
# Do not create a new zone if its centroid is within this distance (metres)
# of any existing RacMonitorGen_zone* zone.
suppression_radius_metres = 300
# How often (seconds) to refresh the in-memory library of existing zones.
# Uses fast direct SQL (zones.sql) ~10ms; so 10s is cheap and deletions
# show on map within one poll cycle. Falls back to mstarrun exportZones.
zones_refresh_interval_seconds = 10
# NOTE: zone name prefix (RacMonitorGen_zone) and elevation (300m) are
# internal constants (minestar.py) — not configurable. Zones are generated
# programmatically; no external template file is needed.

[lanes]
# How often (seconds) to re-query autonomous lane geometry. Lanes rarely
# change, so this defaults to 6 hours to reduce DB load; viewer caches the
# PatchCollection and only rebuilds when data actually changes.
refresh_interval_seconds = 21600

[speed]
# Speed-limit logic: limit = avg_cluster_speed - speed_offset_kmh, clamped
# to [minimum_speed_kmh, maximum_speed_kmh]. If a cluster has no parseable
# speed, default_speed_kmh is used as the avg.
#   default_speed_kmh  — fallback avg when payload speed cannot be parsed (km/h)
#   speed_offset_kmh   — subtract this from avg to get the posted limit (km/h)
#   minimum_speed_kmh  — floor for any posted limit (km/h)
#   maximum_speed_kmh  — ceiling for any posted limit (km/h)
default_speed_kmh = 40
speed_offset_kmh = 10
minimum_speed_kmh = 5
maximum_speed_kmh = 80

[minestar]
# Folder that contains mstarrun.bat (MineStar bin).
mstar_bin_directory = D:\mstar\mstarHome\bus\bin
# MineStar runner executable name.
executable = mstarrun.bat
# Temporary file used when exporting current zones via mstarrun.
current_zones_file = runtime\current_zones.xml
# Seconds to wait for any mstarrun command.
timeout_seconds = 120
# If false, XML is generated but never imported (review only).
import_enabled = true
# If true, logs the import command instead of running it.
dry_run = false
# If true, generates zones as display-only (blue PROPOSED) without calling
# mstarrun at all — useful for testing/lane overlays.
show_only = false
# Pass -AllowOutsideMineBoundary when importing (rare).
allow_outside_mine_boundary = false
# Background mstarrun workers (1 = serialized).
import_workers = 1

[simulation]
# Fakes ONLY the RAC event stream (additive synthetic events at hotspots).
# Lanes and existing zones are still read live from MineStar SQL.
# Enable with enabled=true or --simulate. spawn_per_cycle=1 + tight jitter
# gives a predictable demo: 5-in-50m needed, so zones appear on 5th event.
# real_import=false → PROPOSED only (safe demo, file kept for review).
# real_import=true  → actually runs mstarrun importZones and deletes the xml
#                     like live mode (respects [minestar] import_enabled/dry_run).
enabled = false
real_import = true
random_seed = 20260824
spawn_per_cycle = 1
jitter_metres = 500
level_min = 3
level_max = 4
speed_min = 45
speed_max = 60
time_window_minutes = 120
hotspots = 100.0,100.0,4,50;340.0,180.0,4,50;620.0,420.0,4,50

[display]
# Show the live matplotlib map + event table. Set false for headless/service.
enabled = true
