[application]
# HVC test replication config. Table data is NOT live — refreshed daily at 11:20pm local.
poll_interval_seconds = 8

[database]
# Test SQL replication server (per Chris Fortier 2026-10-01).
server = CGYRTAHSSQLT01.RTS.LOC
# Historian DB for RAC events; MsmodelHVC is queried automatically for zones/lanes.
database = MshistHVC
# HVC-adapted SQL (MshistHVC/MsmodelHVC). Resolved relative to this config file (dist/HVC_sql).
sql_directory = sql
# Test service account svc.hvc.AHSRAC_t — SQL auth, not Windows auth.
use_windows_authentication = false
username = svc.hvc.AHSRAC_t
password = Lur0_Caz5-Tit3-Lym3

[rac]
grouping_radius_metres = 50
grouping_score = 8
minimum_event_count = 5
# Levels (0-5) allowed to form/join a cluster. Empty = all.
# e.g. cluster_levels = 2,3,4,5  → level-1 events never make zones.
cluster_levels =

[zone]
output_directory = output
zone_size_metres = 100
suppression_radius_metres = 300
zones_refresh_interval_seconds = 5

[lanes]
refresh_interval_seconds = 21600

[minestar]
mstarrun_location = D:\mstar\mstarHome\bus\bin\mstarrun.bat

[simulation]
enabled = false
import_enabled = false
random_seed = 20260824
spawn_per_cycle = 1
jitter_metres = 500
level_min = 0
level_max = 5
speed_min = 1
speed_max = 60
time_window_minutes = 120
hotspots = 100.0,100.0;340.0,180.0;620.0,420.0
